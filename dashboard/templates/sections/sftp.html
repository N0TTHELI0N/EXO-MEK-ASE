{% extends "dashboard.html" %}
{% block dashboard_content %}
<div class="mb-6">
  <h2 class="text-2xl font-bold text-white">{{ t('sftp_title') }}</h2>
  <p class="text-gray-400 mt-1">{{ t('sftp_desc') }}</p>
</div>

<div class="bg-gray-800/50 border border-gray-700/50 rounded-2xl p-6 max-w-2xl">
  <form method="POST" action="">
    <input type="hidden" name="section" value="sftp">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="space-y-4">
      <div>
        <label for="sftp_host" class="block text-sm font-medium text-gray-300 mb-1">{{ t('host') }}</label>
        <input type="text" id="sftp_host" name="sftp_host"
               value="{{ settings.sftp_host or '' }}"
               placeholder="127.0.0.1"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
      </div>

      <div>
        <label for="sftp_port" class="block text-sm font-medium text-gray-300 mb-1">{{ t('port') }}</label>
        <input type="number" id="sftp_port" name="sftp_port"
               value="{{ settings.sftp_port or '' }}"
               placeholder="22"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
      </div>

      <div>
        <label for="sftp_username" class="block text-sm font-medium text-gray-300 mb-1">{{ t('username') }}</label>
        <input type="text" id="sftp_username" name="sftp_username"
               value="{{ settings.sftp_username or '' }}"
               placeholder="Enter SFTP username"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
      </div>

      <div>
        <label for="sftp_password" class="block text-sm font-medium text-gray-300 mb-1">{{ t('password') }}</label>
        <input type="password" id="sftp_password" name="sftp_password"
               value=""
               placeholder="{% if settings.sftp_password %}•••••••• (configured){% else %}Enter SFTP password{% endif %}"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
        {% if settings.sftp_password %}
        <p class="text-xs text-green-400 mt-1">{{ t('pwd_configured_keep') }}</p>
        {% endif %}
      </div>
    </div>

    <div class="mt-6 flex items-center space-x-4">
      <button type="button" id="sftp-test-btn"
              class="px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg font-medium transition-colors">
        {{ t('test_connection') }}
      </button>
      <button type="submit"
              class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg font-medium transition-colors">
        {{ t('save') }}
      </button>
      <span id="sftp-test-result" class="text-sm text-gray-400"></span>
    </div>
  </form>
</div>
{% endblock %}
