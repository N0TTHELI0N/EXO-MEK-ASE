<div class="mb-6">
  <h2 class="text-2xl font-bold text-gray-100">License Management</h2>
  <p class="text-gray-400 mt-1">Manage your bot license key and view status.</p>
</div>

<div class="bg-gray-800 rounded-lg p-6 shadow-lg max-w-2xl mb-6">
  <h3 class="text-lg font-semibold text-gray-100 mb-4">Current License</h3>

  <div class="space-y-3">
    <div class="flex items-center justify-between">
      <span class="text-gray-400">Status</span>
      {% if license_valid %}
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-900 text-green-300">Valid</span>
      {% else %}
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-900 text-red-300">Expired / Invalid</span>
      {% endif %}
    </div>

    <div class="flex items-center justify-between">
      <span class="text-gray-400">License Key</span>
      <span class="text-gray-100 font-mono text-sm">{{ settings.license_key or '—' }}</span>
    </div>

    <div class="flex items-center justify-between">
      <span class="text-gray-400">Expires</span>
      <span class="text-gray-100">{{ settings.license_expiry or '—' }}</span>
    </div>
  </div>
</div>

<div class="bg-gray-800 rounded-lg p-6 shadow-lg max-w-2xl">
  <h3 class="text-lg font-semibold text-gray-100 mb-4">Activate New License</h3>

  <form method="POST" action="">
    <input type="hidden" name="section" value="license">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="flex items-end space-x-4">
      <div class="flex-1">
        <label for="new_license_key" class="block text-sm font-medium text-gray-300 mb-1">License Key</label>
        <input type="text" id="new_license_key" name="new_license_key"
               placeholder="XXXX-XXXX-XXXX-XXXX"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>
      <button type="submit"
              class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-colors whitespace-nowrap">
        Activate
      </button>
    </div>
  </form>
</div>
